name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/pages > /tmp/pages.json; then
            echo "Pages site already exists"
            cat /tmp/pages.json
          else
            echo "Creating Pages site"
            gh api -X POST repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f 'source[branch]=main' \
              -f 'source[path]=/'
          fi
          echo "Ensuring source is main /"
          gh api -X PUT repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f 'source[branch]=main' \
            -f 'source[path]=/'
          gh api repos/${{ github.repository }}/pages
